<!doctype html><html lang="it"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Router</title>
<link rel="stylesheet" href="router.css">
<script src="../base1/cockpit.js"></script>
<script defer src="router.js"></script>
</head><body>
<main class="page">
  <div class="head"><div><h1>Router</h1><p>Bridge manuale verso la porta LAN</p></div><span id="badge" class="badge">Ponte: -</span></div>

  <section class="card">
    <h2>Scegli quale modem collegare a enp4s0</h2>
    <div class="grid">
      <button id="w1" class="wan" type="button">
        <span class="title">WAN 1</span>
        <span class="iface">enp3s0 → enp4s0</span>
        <span class="sub">Collega il modem 1 allo switch</span>
      </button>
      <button id="w2" class="wan" type="button">
        <span class="title">WAN 2</span>
        <span class="iface">enx00e04c680270 → enp4s0</span>
        <span class="sub">Collega il modem 2 allo switch</span>
      </button>
    </div>
    <div id="msg" class="msg"></div>
  </section>

  <section class="card">
    <h2>Schema attuale</h2>
    <div class="diagram">
      <div>Modem selezionato</div><div>→</div><div id="selectedIface">-</div><div>→</div><div>br0</div><div>→</div><div>enp4s0</div><div>→</div><div>GS308</div>
    </div>
    <p class="note">I client dietro il GS308 ricevono direttamente DHCP, gateway e rete dal modem selezionato.</p>
  </section>

  <details class="card"><summary>Stato tecnico</summary><pre id="status">Caricamento...</pre></details>
</main></body></html>
