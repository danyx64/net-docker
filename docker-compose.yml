services:
  net-router:
    build: .
    container_name: net-router
    restart: unless-stopped
    network_mode: host
    environment:
      CONFIG_PATH: /config/config.yaml
      ROUTER_SOCKET: /run/net-router/router.sock
      WEB_PORT: "8787"
    volumes:
      - ./config:/config
      - /run/net-router:/run/net-router
